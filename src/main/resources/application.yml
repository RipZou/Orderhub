spring:
  application:
    name: orderhub

  datasource:
    url: jdbc:postgresql://localhost:5433/orderhub
    username: orderhub
    password: orderhub

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    root: INFO
    com.orderhub: DEBUG
