spring:
  profiles:
    active: dev
  application:
    name: orderhub

  datasource:
    url: jdbc:postgresql://localhost:5433/orderhub
    username: orderhub
    password: orderhub

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    root: INFO
    com.orderhub: DEBUG

orderhub:
  jwt:
    secret: ${ORDERHUB_JWT_SECRET:change-me-to-a-very-long-random-secret-at-least-32-chars}
    expiration-ms: 86400000