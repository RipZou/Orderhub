apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderhub
  template:
    metadata:
      labels:
        app: orderhub
    spec:
      containers:
        - name: orderhub
          image: orderhub:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://host.docker.internal:5433/orderhub
            - name: SPRING_DATASOURCE_USERNAME
              value: orderhub
            - name: SPRING_DATASOURCE_PASSWORD
              value: orderhub
            - name: SPRING_DATA_REDIS_HOST
              value: host.docker.internal
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: orderhub
spec:
  selector:
    app: orderhub
  ports:
    - port: 8080
      targetPort: 8080