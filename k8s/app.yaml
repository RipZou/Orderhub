apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orderhub
  template:
    metadata:
      labels:
        app: orderhub
    spec:
      containers:
        - name: orderhub
          image: orderhub:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orderhub-config
            - secretRef:
                name: orderhub-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: orderhub
spec:
  selector:
    app: orderhub
  ports:
    - port: 8080
      targetPort: 8080